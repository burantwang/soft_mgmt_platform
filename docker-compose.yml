# ============================================================
# Sonic 版本发布业务平台 docker-compose
# 包含：mysql(初始化脚本挂载) + backend + frontend(nginx)
# 使用方式：
#   1. 复制 .env.example 为 .env 并配置环境变量
#   2. docker-compose up -d --build
# ============================================================
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dev-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      # 初始化脚本挂载：容器首次启动自动执行
      - ./sql:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dev-platform-backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DB_URL: jdbc:mysql://mysql:3306/dev_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FILE_STORAGE_ROOT: /data/files
      API_PUSH_TOKEN: ${API_PUSH_TOKEN}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
    volumes:
      - file-data:/data/files
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dev-platform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  file-data:
